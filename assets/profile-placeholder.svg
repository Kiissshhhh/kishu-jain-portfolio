<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 820" role="img" aria-labelledby="title desc">
  <title id="title">Kishu Jain initials avatar</title>
  <desc id="desc">A minimal blue and charcoal monogram featuring the initials KJ.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#182a49"/><stop offset="1" stop-color="#0d1523"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#4267e8" stop-opacity=".42"/><stop offset="1" stop-color="#4267e8" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="700" height="820" fill="url(#bg)"/>
  <circle cx="350" cy="350" r="310" fill="url(#glow)"/>
  <circle cx="350" cy="350" r="220" fill="none" stroke="#7894ff" stroke-opacity=".35" stroke-width="2"/>
  <circle cx="350" cy="350" r="244" fill="none" stroke="#7894ff" stroke-opacity=".18" stroke-width="1" stroke-dasharray="5 12"/>
  <text x="350" y="395" text-anchor="middle" fill="#f4f7ff" font-family="Manrope, Arial, sans-serif" font-size="190" font-weight="800" letter-spacing="-18">KJ</text>
  <path d="M250 470h200" stroke="#7894ff" stroke-width="3" stroke-linecap="round"/>
  <text x="350" y="530" text-anchor="middle" fill="#b8c7ef" font-family="Arial, sans-serif" font-size="19" letter-spacing="8">KISHU JAIN</text>
  <text x="350" y="770" text-anchor="middle" fill="#91a6d6" font-family="monospace" font-size="13" letter-spacing="4">SOFTWARE ENGINEER</text>
</svg>
